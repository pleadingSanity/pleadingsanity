<style>
body{margin:0;background:#0b0f19;color:#eef6ff;font-family:system-ui,sans-serif}
header{padding:1.5rem;border-bottom:1px solid #1e293b}
h1{margin:0;font-size:1.4rem;color:#00fff0}
p{color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:1rem}
.card{background:#0d1b2a;border:1px solid #1e293b;border-radius:12px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover;display:block}
.card div{padding:.8rem}
.card h2{margin:0 0 .3rem;font-size:1rem;color:#f59e0b}

</style>
<link rel="webmention" href="https://webmention.io/pleadingsanity.co.uk/webmention">
<link rel="pingback" href="https://webmention.io/pleadingsanity.co.uk/xmlrpc">

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://pleadingsanity.co.uk/#organization",
  "name": "Pleading Sanity",
  "url": "https://pleadingsanity.co.uk/",

    ]
  },
  "sameAs": [
    "https://www.youtube.com/@shanecooper1872"
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://pleadingsanity.co.uk/#website",
  "name": "Pleading Sanity",
  "url": "https://pleadingsanity.co.uk/",

<meta property="og:image" content="https://pleadingsanity.co.uk/assets/crying-brain-og.png">
<meta name="twitter:image" content="https://pleadingsanity.co.uk/assets/crying-brain-og.png">
</head>
<body>
<a href="#grid" class="skip-link">Skip to main content</a>

<header>
<h1>Theme gallery</h1>
<p>Pick a look. Existing site images stay. These are options, not replacements.</p>
</header>
<div class="grid" id="grid"></div>
<script>
fetch('/images/themes/dola-2026/manifest.json').then(r=>r.json()).then(m=>{
  const g=document.getElementById('grid');
  m.themes.forEach(t=>{
    const a=document.createElement('article');
    a.className='card';
    a.innerHTML='<picture><source type="image/webp" srcset="/images/themes/dola-2026/'+t.file.replace(/\.(png|jpg)$/i,".webp")+'"><img src="/images/themes/dola-2026/'+t.file+'" alt="" loading="lazy" decoding="async"></picture><div><h2>'+t.bestFor+'</h2><small>'+t.file+'</small></div>';
    g.appendChild(a);
  });
});
</script>
</body>
</html>
