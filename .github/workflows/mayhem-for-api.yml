# Mayhem for API was added from the vendor template and never scanned this house.
# There is no run_your_api.sh, and MAYHEM_TOKEN is not configured, so every run
# failed on a missing file, then a 401, then a missing SARIF upload.
# This site is static HTML plus Netlify functions. Do not start a local API,
# and do not call the paid scanner, until Shane adds a token on purpose.
# The check name stays "Mayhem for API" so older branch protection still matches.

name: "Mayhem for API"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mayhem-for-api:
    name: Mayhem for API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Skip until a real scanner is configured
        env:
          MAYHEM_TOKEN: ${{ secrets.MAYHEM_TOKEN }}
        run: |
          if [ ! -f ./run_your_api.sh ] || [ -z "$MAYHEM_TOKEN" ]; then
            echo "Mayhem scan skipped. This house has no local API starter and no Mayhem token."
            echo "Nothing was sent to ForAllSecure. Netlify still publishes the site."
            echo "To turn a real scan on later: add MAYHEM_TOKEN and point it at a synthetic spec only. Never scan production with visitor data."
            exit 0
          fi
          echo "A token and starter script are both present."
          echo "The external scan stays off in this file so a half-configured action cannot fail the house."
          echo "Wire a reviewed synthetic target before calling ForAllSecure/mapi-action."
          exit 0
