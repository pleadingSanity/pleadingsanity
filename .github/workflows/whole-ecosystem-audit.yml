name: Whole ecosystem static audit
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - 'data/radio-library.json'
      - 'scripts/audit-ecosystem.mjs'
      - '.github/workflows/whole-ecosystem-audit.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'scripts/audit-ecosystem.mjs'
      - 'tests/**'
      - 'data/radio-library.json'
      - '.github/workflows/whole-ecosystem-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify homepage search and navigation regressions
        run: node --test tests/home-search.test.mjs tests/radio-player.test.mjs tests/radio-integrity.test.js
      - name: Validate Netlify build configuration and local assets
        run: node scripts/validate-build.cjs
      - name: Run comprehensive static audit
        run: node scripts/audit-ecosystem.mjs --json > ecosystem-audit.json
      - name: Print summary
        run: node -e "const r=require('./ecosystem-audit.json'); console.log(JSON.stringify({scope:r.scope,summary:r.summary},null,2))"
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-static-audit
          path: ecosystem-audit.json
          retention-days: 14
      - name: Flag high-confidence missing local references
        run: node scripts/audit-ecosystem.mjs --strict
