# ==============================================================
# 🌌 PLEADING SANITY — UNIVERSAL DEPLOY PIPELINE v4.0
# One File • One Flow • Netlify + Vercel • Auto-Heal
# Evolution Not Erasure • One Source • One Family
# ==============================================================

name: 🚀 Cosmic Deploy — Rise From Madness
run-name: 🌌 Deploy • ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: House check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests stay the same app
        run: |
          python3 - << 'PY'
          import json, pathlib, sys
          site = json.loads(pathlib.Path("manifest.json").read_text())
          arron = json.loads(pathlib.Path("manifest-arron.json").read_text())
          sol = json.loads(pathlib.Path("manifest-solitaire.json").read_text())
          assert site.get("id") == "/" and site.get("start_url") == "/", site
          assert arron.get("id") == "/arron-app.html", arron
          assert sol.get("id") == "/sanity-solitaire.html", sol
          for name in ["index.html","tools.html","crisis.html","games.html","sanity-solitaire.html","arron-app.html","assets/theme/sky.jpg"]:
              assert pathlib.Path(name).exists(), name
          bad = []
          for p in pathlib.Path(".").glob("*.html"):
              text = p.read_text(encoding="utf-8", errors="ignore")
              if "116 123" in text or "Samaritans" in text or "SHOUT to 85258" in text:
                  bad.append(p.name)
          if bad:
              print("Clinic lines returned:", ", ".join(bad))
              sys.exit(1)
          print("House check passed")
          PY
  deploy:
    name: ✨ Sync • Build • Live
    needs: check
    runs-on: ubuntu-latest

    steps:
      # 1 — FRESH CHECKOUT
      - name: 🧱 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2 — NODE ENV
      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3 — INSTALL & BUILD
      - name: 📦 Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install --legacy-peer-deps
          fi

      - name: 🏗️ Build Site
        run: |
          if [ -f "package.json" ]; then
            npm run build || echo "⚠️ Build done with warnings"
          else
            echo "✅ Pure static site — no build needed"
          fi

      # 4 — DEPLOY → NETLIFY
      - name: 🌍 Trigger Netlify
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_HOOK" ]; then
            curl -s -X POST -d '{}' "$NETLIFY_HOOK"
            echo "✅ Netlify Deployed LIVE 🟢"
          else
            echo "⚠️ MISSING: NETLIFY_BUILD_HOOK in Secrets"
          fi

      # 5 — DEPLOY → VERCEL
      - name: ⚡ Trigger Vercel
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            curl -s -X POST "$VERCEL_HOOK"
            echo "✅ Vercel Deployed LIVE 🟢"
          else
            echo "ℹ️ Vercel hook not set — skipping"
          fi

      # 6 — DONE
      - name: ✨ Complete
        run: |
          echo "═══════════════════════════════════════"
          echo "✨ PLEADING SANITY — DEPLOYED"
          echo "═══════════════════════════════════════"
          echo "🕐 $(date)"
          echo "🌐 https://pleadingsanity.co.uk"
          echo "💙 Rise From Madness • Evolution Not Erasure"
