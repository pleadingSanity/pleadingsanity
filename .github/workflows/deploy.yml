# ==============================================================
# 🌌 PLEADING SANITY — UNIVERSAL DEPLOY PIPELINE v4.0
# One File • One Flow • Netlify • Auto-Heal
# Evolution Not Erasure • One Source • One Family
# ==============================================================

name: 🚀 Cosmic Deploy — Rise From Madness
run-name: 🌌 Deploy • ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: House check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests stay the same app
        run: |
          python3 - << 'PY'
          import json, pathlib, sys
          site = json.loads(pathlib.Path("manifest.json").read_text())
          arron = json.loads(pathlib.Path("manifest-arron.json").read_text())
          sol = json.loads(pathlib.Path("manifest-solitaire.json").read_text())
          assert site.get("id") == "/" and site.get("start_url") == "/", site
          assert arron.get("id") == "/arron-app.html", arron
          assert sol.get("id") == "/sanity-solitaire.html", sol
          for name in ["index.html","tools.html","crisis.html","games.html","sanity-solitaire.html","arron-app.html","assets/theme/sky.jpg"]:
              assert pathlib.Path(name).exists(), name
          for name in ["crisis.html", "safety.html", "arron.html", "arron-app.html"]:
              text = pathlib.Path(name).read_text(encoding="utf-8", errors="ignore").lower()
              assert "116 123" in text and "85258" in text, name
              assert "not a clinic" in text or "not a therapist" in text, name
          # The two dedicated safety pages must keep all six UK contacts visible and tappable.
          contacts = {
              "999": "tel:999",
              "116 123": "tel:116123",
              "85258": "sms:85258",
              "111": "tel:111",
              "0800 1111": "tel:08001111",
              "0808 2000 247": "tel:08082000247",
          }
          for name in ["crisis.html", "safety.html"]:
              text = pathlib.Path(name).read_text(encoding="utf-8", errors="ignore")
              for label, href in contacts.items():
                  assert label in text and href in text, f"{name} missing or untappable: {label}"
          print("House check passed")
          PY
  deploy:
    name: ✨ Sync • Build • Live
    needs: check
    runs-on: ubuntu-latest

    steps:
      # 1 — FRESH CHECKOUT
      - name: 🧱 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2 — NODE ENV
      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3 — INSTALL & BUILD
      - name: 📦 Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install --legacy-peer-deps
          fi

      - name: 🏗️ Build Site
        run: |
          if [ -f "package.json" ]; then
            npm run build
          else
            echo "✅ Pure static site — no build needed"
          fi

      # 4 — DEPLOY → NETLIFY
      - name: 🌍 Trigger Netlify
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK is missing from GitHub Actions secrets."
            exit 1
          fi
          # A successful hook response confirms the deploy was requested, not that
          # the new site is already live. Netlify's deploy status is the source of truth.
          curl --fail --show-error --silent --max-time 30 -X POST -d '{}' "$NETLIFY_HOOK"
          echo "✅ Netlify accepted the deploy request."

      # 5 — DONE
      - name: ✨ Complete
        run: |
          echo "═══════════════════════════════════════"
          echo "✨ PLEADING SANITY — DEPLOY REQUEST ACCEPTED"
          echo "═══════════════════════════════════════"
          echo "🕐 $(date)"
          echo "🌐 https://pleadingsanity.co.uk"
          echo "💙 Rise From Madness • Evolution Not Erasure"
          echo "ℹ️ Confirm the live deploy in Netlify before calling it shipped."
