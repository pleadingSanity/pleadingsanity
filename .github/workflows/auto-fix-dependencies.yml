name: 🧠 Pleading Sanity — Auto-Heal & Redeploy
run-name: 🔄 Auto-Heal • ${{ github.event_name }} • ${{ github.sha }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual run from GitHub UI anytime
  schedule:
    - cron: "0 */12 * * *"  # Every 12h — self-heal while you sleep

jobs:
  auto_heal:
    name: 🩺 Dependency Heal → Verify → Redeploy
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit fixes back

    steps:
      # ==========================================
      # 1. FRESH CODE — FULL HISTORY
      # ==========================================
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Complete history for clean, traceable commits

      # ==========================================
      # 2. NODE ENVIRONMENT
      # ==========================================
      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Speed up repeat runs

      # ==========================================
      # 3. SCAN & REPORT
      # ==========================================
      - name: 🔍 Scan dependency health
        run: |
          echo "════════════════════════════════════════"
          echo "🔎 PLEADING SANITY — DEPENDENCY SCAN"
          echo "════════════════════════════════════════"
          npm install --legacy-peer-deps 2>&1 | tail -5
          echo ""
          echo "📊 Checking for outdated packages..."
          npm outdated --long || true
          echo ""

      # ==========================================
      # 4. PIN STABLE VERSIONS
      # ==========================================
      - name: 🧩 Lock known-good versions
        run: |
          echo "🧠 Applying confirmed-stable releases..."

          # mailchimp-marketing — verified compatible
          if grep -q '"mailchimp-marketing":' package.json; then
            sed -i 's/"mailchimp-marketing": "[^"]*"/"mailchimp-marketing": "^3.0.80"/' package.json
            echo "✅ mailchimp-marketing → ^3.0.80"
          fi

          # Sharp — image optimization
          if grep -q '"sharp":' package.json; then
            sed -i 's/"sharp": "[^"]*"/"sharp": "^0.33.5"/' package.json
            echo "✅ sharp → ^0.33.5"
          fi

          # HTML minifier
          if grep -q '"html-minifier-terser":' package.json; then
            sed -i 's/"html-minifier-terser": "[^"]*"/"html-minifier-terser": "^7.2.0"/' package.json
            echo "✅ html-minifier-terser → ^7.2.0"
          fi

          echo ""

      # ==========================================
      # 5. CLEAN INSTALL
      # ==========================================
      - name: 🧹 Rebuild clean dependency tree
        run: |
          echo "🧹 Fresh install..."
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          echo "✅ Install complete"

      # ==========================================
      # 6. COMMIT CHANGES
      # ==========================================
      - name: 💾 Commit fixes
        id: commit
        run: |
          git config user.name "Pleading-Sanity-AutoHeal"
          git config user.email "pleadingsanitydev@gmail.com"

          git add package.json package-lock.json

          if git diff --staged --quiet; then
            echo "✅ Already stable — no changes needed"
            echo "CHANGES=none" >> $GITHUB_OUTPUT
          else
            git commit -m "🤖 auto-heal: deps refreshed • $(date +%Y-%m-%d)"
            git push origin main
            echo "✅ Fixes committed & pushed to main"
            echo "CHANGES=applied" >> $GITHUB_OUTPUT
          fi

      # ==========================================
      # 7. DEPLOY — NETLIFY
      # ==========================================
      - name: 🌍 Trigger Netlify
        if: always()
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_HOOK" ]; then
            echo "🌍 Netlify → building..."
            curl -s -X POST -d '{}' "$NETLIFY_HOOK" && echo "✅ Netlify triggered" || echo "⚠️ Hook responded with error"
          else
            echo "⚠️ Add NETLIFY_BUILD_HOOK → Repository → Settings → Secrets"
          fi

      # ==========================================
      # 8. DEPLOY — VERCEL
      # ==========================================
      - name: ⚡ Trigger Vercel
        if: always()
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            echo "⚡ Vercel → deploying..."
            curl -s -X POST "$VERCEL_HOOK" && echo "✅ Vercel triggered" || echo "⚠️ Hook responded with error"
          else
            echo "⚠️ Add VERCEL_DEPLOY_HOOK → Repository → Settings → Secrets"
          fi

      # ==========================================
      # 9. FINAL HEALTH CHECK
      # ==========================================
      - name: 🩺 Verify live site
        if: always()
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://pleadingsanity.co.uk' }}
        run: |
          echo "════════════════════════════════════════"
          echo "✨ PLEADING SANITY — AUTO-HEAL COMPLETE"
          echo "════════════════════════════════════════"
          echo "🕐 Checked: $(date)"
          echo "🔄 Changes: ${{ steps.commit.outputs.CHANGES }}"
          echo "🌐 Site: $SITE_URL"
          echo ""
          curl -Is "$SITE_URL" | head -n 1
          echo ""
          echo "✅ System self-sustaining • Rise From Madness ✨"
