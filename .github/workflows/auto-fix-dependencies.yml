name: 🧠 Pleading Sanity Infinity – Auto-Heal Dependencies & Redeploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"  # twice a day

jobs:
  heal_dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛠️ Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Scan for broken or invalid dependencies
        run: |
          echo "🔎 Checking all dependencies for Pleading Sanity Infinity OS..."
          npm install --legacy-peer-deps || true
          npm outdated || true

      - name: 🧩 Auto-fix invalid or missing dependencies
        run: |
          echo "🧠 Auto-healing dependency issues..."
          # Fix mailchimp-marketing if version invalid
          if grep -q '"mailchimp-marketing":' package.json; then
            sed -i 's/"mailchimp-marketing": "[^"]*"/"mailchimp-marketing": "^3.0.80"/' package.json
            echo "✅ mailchimp-marketing fixed to ^3.0.80"
          fi

          # Detect and remove unpublished/broken packages
          npm ls || echo "⚠️ Some packages may be broken"
          echo "🧹 Cleaning cache and reinstalling..."
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps || echo "⚠️ Attempted auto-repair"

      - name: 💾 Commit & Push Fixes
        run: |
          git config user.name "Copilot-AutoFix"
          git config user.email "pleadingsanitydev@gmail.com"
          git add package.json package-lock.json
          git diff --quiet && echo "✅ No dependency issues found" || (
            git commit -m "fix(deps): auto-heal dependency issues – Rise From Madness"
            git push origin main
          )

      - name: 🚀 Trigger Netlify & Vercel Redeploy
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "${NETLIFY_BUILD_HOOK}" ]; then
            echo "🌍 Triggering Netlify build..."
            curl -s -X POST -d '{}' "${NETLIFY_BUILD_HOOK}" || echo "⚠️ Netlify redeploy failed"
          fi
          if [ -n "${VERCEL_DEPLOY_HOOK}" ]; then
            echo "🚀 Triggering Vercel build..."
            curl -s -X POST "${VERCEL_DEPLOY_HOOK}" || echo "⚠️ Vercel redeploy failed"
          fi

      - name: 🩺 Health Check
        env:
          NETLIFY_SITE_URL: ${{ secrets.NETLIFY_SITE_URL }}
          VERCEL_SITE_URL: ${{ secrets.VERCEL_SITE_URL }}
        run: |
          echo "🩺 Checking site health..."
          curl -Is "$NETLIFY_SITE_URL" | head -n 1
          curl -Is "$VERCEL_SITE_URL" | head -n 1
          echo "✨ Dependency healing and redeploy complete."