name: ✨ Pleading Sanity — Universal Cosmic Sync
run-name: 🌌 Sync • Deploy • Arron AI Core

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual sync anytime

permissions:
  contents: read

jobs:
  cosmic_sync:
    name: 🧠 Full Ecosystem Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 🔑 ALL SECRETS — confirm in GitHub → Repo → Settings → Secrets
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_SECRET: ${{ secrets.AI_API_SECRET }}
      AI_API_ADMIN: ${{ secrets.AI_API_ADMIN }}
      API_V3_PS_KEY: ${{ secrets.API_V3_PS_KEY }}
      NETLIFY_BUILD_TOKEN: ${{ secrets.NETLIFY_BUILD_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      SHOPIFY_API: ${{ secrets.SHOPIFY_API }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # 2. SECRET STATUS — CLEAR REPORT
      # ==========================================
      - name: 🔑 Cosmic Key Status
        run: |
          echo "════════════════════════════════════════"
          echo "🌍 PLEADING SANITY — COSMIC SYNC"
          echo "════════════════════════════════════════"
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo ""

          ALL_KEYS="OPENAI_API_KEY AI_API_KEY AI_API_SECRET AI_API_ADMIN API_V3_PS_KEY NETLIFY_BUILD_TOKEN NETLIFY_SITE_ID SHOPIFY_API VERCEL_TOKEN"
          MISSING=0

          for KEY in $ALL_KEYS; do
            if [ -z "${!KEY}" ]; then
              echo "⚠️  MISSING: $KEY"
              MISSING=1
            else
              echo "✅ $KEY — loaded"
            fi
          done

          echo ""
          if [ $MISSING -eq 1 ]; then
            echo "⚠️ Some secrets not set — limited functionality only"
          else
            echo "✅ ALL SYSTEMS GO — Full Cosmic Alignment ✨"
          fi
          echo ""

      # ==========================================
      # 3. DEPLOY → NETLIFY
      # ==========================================
      - name: 🌍 Deploy to Netlify
        if: env.NETLIFY_SITE_ID != '' && env.NETLIFY_BUILD_TOKEN != ''
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./out
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Add deploy-message
          deploy-message: "Cosmic Sync — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_BUILD_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # ==========================================
      # 4. DEPLOY → VERCEL
      # ==========================================
      - name: ⚡ Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          echo "⚡ Deploying to Vercel..."
          npm install -g vercel --silent
          vercel deploy --prod --token="$VERCEL_TOKEN"
          echo "✅ Vercel live"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # ==========================================
      # 5. SYNC → ARRON AI CORE
      # ==========================================
      - name: 🧩 Ping Arron AI Core
        if: env.AI_API_KEY != ''
        run: |
          echo "🧠 Syncing with Arron AI Core..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://filefixerapi.com/api/v1/filefixer/update-website \
            -H "Authorization: Bearer $AI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"repo":"'"$GITHUB_REPOSITORY"'", "actor":"'"$GITHUB_ACTOR"'"}')

          BODY=$(echo "$RESPONSE" | head -n 1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ]; then
            echo "✅ Arron Core synced — status $STATUS"
          else
            echo "⚠️ Arron Core responded: $STATUS"
            echo "Response: $BODY"
            echo "→ If 'link fetch error', API may be temporarily down or endpoint changed"
            echo "→ Skipping — deploy continues"
          fi

      # ==========================================
      # 6. FINAL SUMMARY
      # ==========================================
      - name: ✨ Cosmic Sync Complete
        run: |
          echo "════════════════════════════════════════"
          echo "✨ UNIVERSAL COSMIC SYNC — FINISHED"
          echo "════════════════════════════════════════"
          echo "🕐 Time: $(date)"
          echo "👤 Founder: Shane Cooper"
          echo "🌌 Mission: One Source. One Consciousness. One Family."
          echo "✨ Rise From Madness"
