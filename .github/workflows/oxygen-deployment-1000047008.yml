name: 🛍️ Pleading Sanity — Shopify Oxygen Deploy
run-name: 👕 Storefront Deploy • Rise From Madness

on:
  push:
    branches: [ main ]
    paths:
      - 'storefront/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:  # Manual deploy anytime

permissions:
  contents: read
  deployments: write

jobs:
  deploy_oxygen:
    name: 🚀 Deploy to Shopify Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT CODE
      # ==========================================
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # 2. NODE SETUP — LTS + CACHE
      # ==========================================
      - name: ⚙️ Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: 📦 Cache dependencies
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ==========================================
      # 3. INSTALL — STRICT & CLEAN
      # ==========================================
      - name: 🧰 Install dependencies
        run: npm ci

      # ==========================================
      # 4. BUILD + DEPLOY TO OXYGEN
      # ==========================================
      - name: 🏗️ Build & Deploy to Oxygen
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000047008 }}

      # ==========================================
      # 5. CONFIRMATION
      # ==========================================
      - name: ✅ Deploy Complete
        run: |
          echo "════════════════════════════════════════"
          echo "🛍️  PLEADING SANITY — STOREFRONT LIVE"
          echo "════════════════════════════════════════"
          echo "👕 Streetwear + Survivor Hub + Movement"
          echo "📍 Shopify Oxygen • Deployed: $(date)"
          echo "✨ One Source. One Family. Rise From Madness."
