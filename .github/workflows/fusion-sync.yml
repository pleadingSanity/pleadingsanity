name: 🧠 Pleading Sanity Infinity – Human-AI Fusion Sync & Auto-Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fusion_sync_autofix:
    name: 🩸 Sync, Heal, and Auto-Fix
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🧱 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧠 Configure Git Identity
        run: |
          git config user.name "PleadingSanity-AI"
          git config user.email "pleadingsanitydev@gmail.com"

      - name: 🩹 Heal Dependencies
        run: |
          echo "🔍 Checking mailchimp-marketing version..."
          if grep -q '"mailchimp-marketing":' package.json; then
            sed -i 's/"mailchimp-marketing": "[^"]*"/"mailchimp-marketing": "^3.0.80"/' package.json
            echo "✅ mailchimp-marketing dependency fixed"
          else
            echo "⚠️ Dependency not found"
          fi

      - name: 🧰 Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile || yarn install
          elif [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile || pnpm install
          else
            npm install
          fi

      - name: 🔎 Lint and Auto-Fix Code
        run: |
          echo "✨ Running ESLint auto-fix..."
          npx eslint . --ext .js,.jsx,.ts,.tsx --fix || echo "⚠️ Lint completed with warnings"
          echo "✅ Lint auto-fix done"

      - name: 🧪 Validate Build
        run: |
          echo "🏗️ Testing build..."
          if [ -f "package.json" ]; then
            npm run build || echo "⚠️ Build errors captured"
          fi

      - name: 💾 Commit & Push Fixes
        run: |
          echo "🧹 Detecting lockfile..."
          LOCKFILE=""
          if [ -f "package-lock.json" ]; then
            LOCKFILE="package-lock.json"
          elif [ -f "yarn.lock" ]; then
            LOCKFILE="yarn.lock"
          elif [ -f "pnpm-lock.yaml" ]; then
            LOCKFILE="pnpm-lock.yaml"
          fi

          echo "🔍 Using lockfile: ${LOCKFILE:-none}"
          git add package.json ${LOCKFILE:-} || true
          git add . || true
          git diff --quiet && echo "✅ No code or dependency changes" || (
            git commit -m "🤖 Auto-Heal & Lint Fix — PleadingSanity-AI (Fusion Protocol)"
            git push origin main
          )

      - name: 🌐 Mirror to Twin Repository
        env:
          SECONDARY_REPO: ${{ secrets.SECONDARY_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "$SECONDARY_REPO" ]; then
            echo "🔄 Syncing to twin repo: $SECONDARY_REPO"
            git remote add mirror "https://x-access-token:${GH_TOKEN}@github.com/${SECONDARY_REPO}.git"
            git push mirror main --force
            echo "✅ Mirror sync complete"
          else
            echo "⚠️ SECONDARY_REPO secret not set"
          fi

      - name: 🚀 Trigger Netlify & Vercel Redeploys
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "${NETLIFY_BUILD_HOOK}" ]; then
            echo "🌍 Triggering Netlify redeploy..."
            curl -s -X POST -d '{}' "${NETLIFY_BUILD_HOOK}" || echo "⚠️ Netlify redeploy failed"
          fi
          if [ -n "${VERCEL_DEPLOY_HOOK}" ]; then
            echo "🚀 Triggering Vercel redeploy..."
            curl -s -X POST "${VERCEL_DEPLOY_HOOK}" || echo "⚠️ Vercel redeploy failed"
          fi
name: 🧠 Pleading Sanity – Fusion AI Master (Auto-Fix + Redeploy + Sync)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fusion_ai_master:
    name: 🤖 Heal, Fix & Sync – Unified Copilot System
    runs-on: ubuntu-latest

    steps:
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git identity
        run: |
          git config user.name "PleadingSanity-AI"
          git config user.email "pleadingsanitydev@gmail.com"

      - name: 🧩 Validate and Heal Dependencies
        run: |
          echo "🔍 Checking dependencies for issues..."
          if [ -f "package.json" ]; then
            if grep -q '"mailchimp-marketing":' package.json; then
              echo "🛠 Fixing mailchimp-marketing version..."
              sed -i 's/"mailchimp-marketing": "[^"]*"/"mailchimp-marketing": "^3.0.80"/' package.json
              echo "✅ mailchimp-marketing dependency fixed."
            else
              echo "⚠️ mailchimp-marketing not found in package.json"
            fi
          fi
          echo "🧹 Running npm install..."
          npm install || npm install --legacy-peer-deps || true

      - name: 🧠 AI Copilot Auto-Fix (Code & Lint)
        run: |
          echo "✨ Running Copilot-style auto-fix..."
          if [ -d "src" ] || [ -d "app" ]; then
            npx eslint . --ext .js,.jsx,.ts,.tsx --fix || echo "⚠️ ESLint completed with warnings"
          else
            echo "⚠️ No src or app directory found to lint."
          fi
          echo "✅ Auto-fix pass complete."

      - name: 🧰 Build Check (Pre-Deploy)
        run: |
          echo "🏗️ Running project build..."
          npm run build || echo "⚠️ Build failed but continuing for repair."

      - name: 💾 Commit & Push Fixes
        run: |
          echo "📦 Preparing commits..."
          git add package.json || true
          git add . || true
          git diff --quiet && echo "✅ No fixes to commit" || (
            git commit -m "🤖 Fusion AI: Heal + Auto-Fix + Sync (Pleading Sanity)"
            git push origin main
          )

      - name: 🌐 Trigger Netlify & Vercel Redeploys
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "${NETLIFY_BUILD_HOOK}" ]; then
            echo "🌍 Triggering Netlify redeploy..."
            curl -s -X POST -d '{}' "${NETLIFY_BUILD_HOOK}" || echo "⚠️ Netlify redeploy failed"
          fi
          if [ -n "${VERCEL_DEPLOY_HOOK}" ]; then
            echo "🚀 Triggering Vercel redeploy..."
            curl -s -X POST "${VERCEL_DEPLOY_HOOK}" || echo "⚠️ Vercel redeploy failed"
          fi

      - name: 🪞 Cross-Repo Sync (Infinity ↔ PleadingSanity)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Syncing updates across repos..."
          git fetch origin main
          echo "🌌 Merging Infinity ↔ PleadingSanity changes..."
          git pull origin main --no-edit || echo "⚠️ No updates needed"
          echo "✅ Sync complete. Fusion AI Master finished successfully."