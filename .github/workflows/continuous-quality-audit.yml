name: Continuous quality audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check pages, assets, browser scripts and TypeScript backend syntax
        run: python3 scripts/audit-site.py

      - name: Check private chart-request behaviour
        run: node --experimental-vm-modules --test scripts/test-cosmic-reflections.mjs
      - name: Check local journal persistence failures
        run: node --test scripts/test-journal-vault.mjs

      - name: Check game saves, scoreboards and App Hub destinations
        run: node --experimental-vm-modules --test scripts/test-game-progress.mjs

      - name: Check AI family introduction boundaries
        run: node --test scripts/test-ai-family-intro.mjs
