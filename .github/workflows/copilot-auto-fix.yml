name: 🧠 Pleading Sanity Infinity – Copilot Auto-Fix & Redeploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  # ==========================================
  # JOB 1: AUTO-FIX DEPENDENCIES & CONFIG
  # ==========================================
  copilot_auto_fix:
    name: 🤖 Auto-Fix Dependencies & Config
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit & push changes

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for proper commits

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Speed up installs

      - name: 🧩 Fix mailchimp-marketing version
        run: |
          echo "🔧 Checking mailchimp-marketing version..."
          if grep -q '"mailchimp-marketing":' package.json; then
            sed -i 's/"mailchimp-marketing": "[^"]*"/"mailchimp-marketing": "^3.0.80"/' package.json
            echo "✅ Set mailchimp-marketing → ^3.0.80"
          else
            echo "⚠️ mailchimp-marketing not found — skipping"
          fi

      - name: 🧩 Fix Sharp image optimizer
        run: |
          echo "🔧 Checking sharp version..."
          if grep -q '"sharp":' package.json; then
            sed -i 's/"sharp": "[^"]*"/"sharp": "^0.33.5"/' package.json
            echo "✅ Set sharp → ^0.33.5"
          else
            echo "⚠️ sharp not found — will add"
          fi

      - name: 🧩 Add html-minifier-terser if missing
        run: |
          echo "🔧 Checking html-minifier-terser..."
          if ! grep -q '"html-minifier-terser":' package.json; then
            sed -i '/"dependencies": {/a \ \ \ \ "html-minifier-terser": "^7.2.0",' package.json
            echo "✅ Added html-minifier-terser → ^7.2.0"
          else
            echo "✅ Already present"
          fi

      - name: 💾 Commit & Push Auto-Fixes
        run: |
          git config user.name "Pleading-Sanity-Copilot"
          git config user.email "pleadingsanitydev@gmail.com"
          
          git add package.json
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-fix: dependency versions • cosmic alignment"
            git push origin main
            echo "✅ Changes pushed to main"
          else
            echo "✅ No changes needed — already aligned"
          fi

  # ==========================================
  # JOB 2: INSTALL & HEALTH CHECK
  # ==========================================
  health_verify:
    name: 🩺 Verify Build Integrity
    needs: copilot_auto_fix
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # Pull latest including any auto-fix commits

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci  # Strict install from package-lock.json

      - name: 🧪 Run Health Check
        run: |
          if [ -f scripts/health-check.js ]; then
            NODE_ENV=production SITE_URL=https://pleadingsanity.co.uk node scripts/health-check.js
          else
            echo "⚠️ health-check.js not found — skipping"
          fi

  # ==========================================
  # JOB 3: REDEPLOY TO ALL PLATFORMS
  # ==========================================
  redeploy_all:
    name: 🌐 Redeploy — Netlify + Vercel
    needs: health_verify
    runs-on: ubuntu-latest
    if: success()
    env:
      NETLIFY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
      VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - name: 🚀 Trigger Netlify
        run: |
          if [ -n "$NETLIFY_HOOK" ]; then
            echo "🌍 Netlify → building..."
            curl -s -X POST -d '{}' "$NETLIFY_HOOK" && echo "✅ Netlify triggered" || echo "⚠️ Netlify hook failed"
          else
            echo "⚠️ NETLIFY_BUILD_HOOK not set in repo secrets"
          fi

      - name: 🚀 Trigger Vercel
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            echo "⚡ Vercel → deploying..."
            curl -s -X POST "$VERCEL_HOOK" && echo "✅ Vercel triggered" || echo "⚠️ Vercel hook failed"
          else
            echo "⚠️ VERCEL_DEPLOY_HOOK not set in repo secrets"
          fi

      - name: 📋 Summary
        run: |
          echo "════════════════════════════════════════"
          echo "✅ PLEADING SANITY — PIPELINE COMPLETE"
          echo "════════════════════════════════════════"
          echo "Auto-Fix → Verify → Redeploy all done ✨"
          echo "Check your deploy dashboards for live status"
          echo "════════════════════════════════════════"
