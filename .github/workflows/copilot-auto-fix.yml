name: 🧠 Pleading Sanity — Infinity Auto-Fix & Redeploy
run-name: 🌌 ${{ github.event_name }} • Rise From Madness

on:
  push:
    branches: [ main ]
  workflow_dispatch  # Manual trigger from GitHub UI anytime
  schedule:
    - cron: "0 */12 * * *"  # Self-heal twice daily — while you rest

jobs:
  # ==========================================
  # JOB 1: AUTO-FIX DEPENDENCIES & CONFIG
  # ==========================================
  copilot_auto_fix:
    name: 🤖 Fix • Pin • Align
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit & push changes

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🧩 Pin mailchimp-marketing → stable
        run: |
          echo "🔧 Checking mailchimp-marketing..."
          if grep -q '"mailchimp-marketing":' package.json; then
            sed -i 's/"mailchimp-marketing": "[^"]*"/"mailchimp-marketing": "^3.0.80"/' package.json
            echo "✅ mailchimp-marketing → ^3.0.80 (confirmed stable)"
          else
            npm install mailchimp-marketing@^3.0.80 --save
            echo "✅ Added mailchimp-marketing ^3.0.80"
          fi

      - name: 🧩 Pin sharp → optimized
        run: |
          echo "🔧 Checking sharp..."
          if grep -q '"sharp":' package.json; then
            sed -i 's/"sharp": "[^"]*"/"sharp": "^0.33.5"/' package.json
            echo "✅ sharp → ^0.33.5"
          else
            npm install sharp@^0.33.5 --save
            echo "✅ Added sharp ^0.33.5"
          fi

      - name: 🧩 Ensure html-minifier-terser present
        run: |
          echo "🔧 Checking html-minifier-terser..."
          if ! grep -q '"html-minifier-terser":' package.json; then
            npm install html-minifier-terser@^7.2.0 --save
            echo "✅ Added html-minifier-terser ^7.2.0"
          else
            echo "✅ Already at target version"
          fi

      - name: 🧹 Rebuild clean lockfile
        run: |
          echo "🧹 Fresh install..."
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          echo "✅ Dependencies aligned"

      - name: 💾 Commit & Push Auto-Fixes
        id: commit
        run: |
          git config user.name "Pleading-Sanity-Dola"
          git config user.email "pleadingsanitydev@gmail.com"
          
          git add package.json package-lock.json
          
          if git diff --staged --quiet; then
            echo "✅ Already perfect — no changes needed"
            echo "STATUS=none" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git commit -m "🤖 auto-fix: deps pinned • cosmic alignment ✨"
          git push origin main
          echo "✅ Changes pushed to main"
          echo "STATUS=applied" >> $GITHUB_OUTPUT

  # ==========================================
  # JOB 2: BUILD VERIFICATION
  # ==========================================
  health_verify:
    name: 🏗️ Build • Verify
    needs: copilot_auto_fix
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 🛠️ Checkout latest main
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install clean
        run: npm ci

      - name: 🔨 Build production
        run: |
          echo "🔨 Building..."
          npm run build
          echo "✅ Build successful"

      - name: 🩺 Health Check
        run: |
          if [ -f scripts/health-check.js ]; then
            NODE_ENV=production SITE_URL=https://pleadingsanity.co.uk node scripts/health-check.js
          else
            echo "⚠️ health-check.js not found — skipping"
          fi

  # ==========================================
  # JOB 3: REDEPLOY ALL PLATFORMS
  # ==========================================
  redeploy_all:
    name: 🚀 Deploy — Netlify + Vercel
    needs: health_verify
    runs-on: ubuntu-latest
    if: success()
    env:
      NETLIFY_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
      VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      SITE_URL: ${{ secrets.SITE_URL || 'https://pleadingsanity.co.uk' }}

    steps:
      - name: 🚀 Trigger Netlify
        run: |
          if [ -n "$NETLIFY_HOOK" ]; then
            echo "🌍 Netlify → building..."
            curl -s -X POST -d '{}' "$NETLIFY_HOOK" && echo "✅ Netlify LIVE" || echo "⚠️ Hook responded — check secret"
          else
            echo "⚠️ Set NETLIFY_BUILD_HOOK → Repo → Settings → Secrets"
          fi

      - name: ⚡ Trigger Vercel
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            echo "⚡ Vercel → deploying..."
            curl -s -X POST "$VERCEL_HOOK" && echo "✅ Vercel LIVE" || echo "⚠️ Hook responded — check secret"
          else
            echo "⚠️ Set VERCEL_DEPLOY_HOOK → Repo → Settings → Secrets"
          fi

      - name: ✨ Final Status
        run: |
          echo "════════════════════════════════════════"
          echo "✅ PLEADING SANITY — PIPELINE COMPLETE"
          echo "════════════════════════════════════════"
          echo "🕐 Completed: $(date)"
          echo "🌐 Site: $SITE_URL"
          echo "🔄 Changes: ${{ needs.copilot_auto_fix.outputs.STATUS }}"
          echo ""
          echo "Rise From Madness 💙🌌✨"
