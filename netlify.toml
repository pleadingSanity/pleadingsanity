[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --legacy-peer-deps && npm run build"

[[redirects]]
  from = "http://www.pleadingsanity.co.uk/*"
  to = "https://pleadingsanity.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pleadingsanity.co.uk/*"
  to = "https://pleadingsanity.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://pleadingsanity.co.uk/*"
  to = "https://pleadingsanity.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pleadingsanity.uk/*"
  to = "https://pleadingsanity.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
