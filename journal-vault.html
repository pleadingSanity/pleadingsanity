<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal Vault — Pleading Sanity | Rise From Madness</title>
  <link rel="icon" href="assets/favicon.ico" />
  <meta name="description" content="Your stories. Your voice. Safe, seen, sacred. The Pleading Sanity Journal Vault — every entry matters." />
  
  <!-- ✅ NO GOOGLE FONTS — SYSTEM STACK = INSTANT, NO ERRORS -->
  <style>
    :root {
      --primary-cyan: #00fff0;
      --secondary-magenta: #ff00ff;
      --gold: #ffd700;
      --bg-dark: #0d1b2a;
      --bg-darker: #000510;
      --text-light: #f0faff;
      --text-muted: #b9faff;
      --surface-alpha: rgba(0,255,240,0.06);
      --border-alpha: rgba(0,255,240,0.13);
      --shadow-glow: 0 0 48px rgba(0,255,240,0.09);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      
      /* System font stack — fast, no external calls */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 
                   'Helvetica Neue', Arial, sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background: radial-gradient(ellipse at 50% 120%, #1a0b3d 0%, var(--bg-dark) 45%, var(--bg-darker) 100%);
      color: var(--text-light);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      transition: var(--transition);
      line-height: 1.7;
    }
    
    body.light-mode {
      --primary-cyan: #0066cc;
      --secondary-magenta: #cc0066;
      --bg-dark: #f5f7fa;
      --bg-darker: #ffffff;
      --text-light: #1a202c;
      --text-muted: #4a5568;
      --surface-alpha: rgba(0,102,204,0.06);
      --border-alpha: rgba(0,102,204,0.13);
      --shadow-glow: 0 0 48px rgba(0,102,204,0.09);
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    
    .page-header {
      text-align: center;
      margin-bottom: 30px;
      padding-top: 10px;
    }
    
    .page-header h1 {
      color: var(--primary-cyan);
      text-shadow: 0 0 25px rgba(0,255,240,0.35);
      font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    
    .page-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto;
    }
    
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--surface-alpha);
      border: 1px solid var(--border-alpha);
      border-radius: 50px;
      padding: 8px 16px;
      cursor: pointer;
      transition: var(--transition);
      backdrop-filter: blur(10px);
      font-size: 0.9rem;
      color: var(--text-light);
      font-family: inherit;
    }
    
    .theme-toggle:hover {
      background: var(--primary-cyan);
      color: #000;
      transform: scale(1.05);
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface-alpha);
      border-radius: 21px;
      padding: 30px;
      box-shadow: var(--shadow-glow);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-alpha);
      animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .controls {
      text-align: center;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    
    .btn {
      background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--secondary-magenta) 100%);
      color: #000;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(0,255,240,0.2);
      font-size: 0.95rem;
      font-family: inherit;
    }
    
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(255,0,255,0.3);
    }
    
    .btn-secondary {
      background: transparent;
      color: var(--primary-cyan);
      border: 1px solid var(--primary-cyan);
    }
    
    .btn-secondary:hover {
      background: var(--primary-cyan);
      color: #000;
      border-color: var(--primary-cyan);
    }
    
    .submit-section {
      background: rgba(0,255,240,0.04);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(0,255,240,0.12);
    }
    
    .submit-section h2 {
      color: var(--primary-cyan);
      margin-bottom: 15px;
      font-size: 1.25rem;
    }
    
    .submit-textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-alpha);
      border-radius: 10px;
      padding: 15px;
      color: var(--text-light);
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 12px;
      transition: var(--transition);
    }
    
    .submit-textarea:focus {
      outline: none;
      border-color: var(--primary-cyan);
      box-shadow: 0 0 15px rgba(0,255,240,0.2);
    }
    
    .search-box {
      width: 100%;
      max-width: 450px;
      padding: 14px 20px;
      border-radius: 30px;
      border: 1px solid var(--border-alpha);
      background: var(--surface-alpha);
      color: var(--text-light);
      margin: 0 auto 25px;
      display: block;
      font-size: 1rem;
      transition: var(--transition);
      backdrop-filter: blur(10px);
      font-family: inherit;
    }
    
    .search-box:focus {
      outline: none;
      border-color: var(--primary-cyan);
      box-shadow: 0 0 20px rgba(0,255,240,0.2);
    }
    
    .search-box::placeholder { color: var(--text-muted); }
    
    .stats {
      text-align: center;
      margin-bottom: 25px;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-alpha);
    }
    
    .entry {
      background: var(--surface-alpha);
      border: 1px solid var(--border-alpha);
      border-radius: 16px;
      padding: 24px;
      margin: 20px 0;
      box-shadow: var(--shadow-glow);
      backdrop-filter: blur(8px);
      transition: var(--transition);
      animation: slideIn 0.5s ease-out;
      position: relative;
      overflow: hidden;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .entry::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-cyan), var(--secondary-magenta));
      opacity: 0;
      transition: var(--transition);
    }
    
    .entry:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0,255,240,0.12);
      border-color: rgba(0,255,240,0.3);
    }
    
    .entry:hover::before { opacity: 1; }
    
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0,255,240,0.15);
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .entry-number {
      color: var(--primary-cyan);
      font-weight: 800;
      font-size: 1.1rem;
    }
    
    .entry-date {
      color: var(--secondary-magenta);
      font-size: 0.9rem;
    }
    
    .entry-source {
      color: var(--gold);
      font-size: 0.85rem;
      background: rgba(255,215,0,0.1);
      padding: 2px 10px;
      border-radius: 20px;
    }
    
    .entry-text {
      font-size: 1.05rem;
      line-height: 1.8;
      white-space: pre-wrap;
    }
    
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 50px 30px;
    }
    
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.5;
    }
    
    .footer-note {
      text-align: center;
      margin-top: 40px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .footer-note a {
      color: var(--primary-cyan);
      text-decoration: none;
    }
    
    .footer-note a:hover {
      color: var(--secondary-magenta);
      text-decoration: underline;
    }
    
    /* Mobile */
    @media (max-width: 768px) {
      body { padding: 15px 10px; }
      .container { padding: 20px; border-radius: 16px; }
      .theme-toggle { position: relative; top: 0; right: 0; margin: 0 auto 20px; display: block; }
      .entry-header { flex-direction: column; align-items: flex-start; }
      .submit-section { padding: 20px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
    <span id="theme-icon">🌙</span>
    <span id="theme-text">Dark</span>
  </button>

  <header class="page-header">
    <h1>📖 Journal Vault</h1>
    <p>Your story matters. Safe. Seen. Sacred.</p>
  </header>

  <div class="container">
    <!-- ✍️ SUBMISSION FORM -->
    <div class="submit-section">
      <h2>✍️ Add Your Voice</h2>
      <textarea 
        id="newEntryText" 
        class="submit-textarea" 
        placeholder="Write your truth here — a thought, a moment, a breakthrough, a memory. Whatever you need to share. You are safe here."
      ></textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" onclick="addEntry()">💾 Save to Vault</button>
        <button class="btn btn-secondary" onclick="document.getElementById('newEntryText').value=''">Clear</button>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="btn btn-secondary" onclick="loadVault()">🔄 Refresh</button>
      <button class="btn btn-secondary" onclick="exportVault()">⬇️ Export</button>
      <button class="btn btn-secondary" onclick="printVault()">🖨️ Print</button>
      <button class="btn btn-secondary" onclick="clearVault()">🗑️ Clear All</button>
    </div>

    <!-- SEARCH -->
    <input 
      type="text" 
      id="searchBox" 
      class="search-box" 
      placeholder="Search entries by word, feeling, theme..." 
      onkeyup="filterEntries()"
    >

    <!-- STATS -->
    <div class="stats" id="stats"></div>

    <!-- ENTRIES -->
    <div id="vault-content"></div>
  </div>

  <footer class="footer-note">
    <p>Part of <a href="movement.html">Pleading Sanity</a> — One Source. One Consciousness. One Family.</p>
    <p style="margin-top:5px;">Your words stay with you unless you choose to share them.</p>
  </footer>

  <script>
    let allEntries = [];
    let currentTheme = localStorage.getItem('vaultTheme') || 'dark';

    // THEME SYSTEM
    function initTheme() {
      if (currentTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-text').textContent = 'Light';
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.classList.toggle('light-mode');
      document.getElementById('theme-icon').textContent = currentTheme === 'light' ? '☀️' : '🌙';
      document.getElementById('theme-text').textContent = currentTheme === 'light' ? 'Light' : 'Dark';
      localStorage.setItem('vaultTheme', currentTheme);
    }

    // ✍️ ADD NEW ENTRY
    function addEntry() {
      const text = document.getElementById('newEntryText').value.trim();
      if (!text) {
        alert("⚠️ Write something first — your voice is waiting.");
        return;
      }

      const entry = {
        id: Date.now(),
        timestamp: new Date().toISOString(),
        text: text,
        source: 'Personal Submission'
      };

      allEntries.unshift(entry); // Newest at top
      saveVault();
      displayEntries(allEntries);
      updateStats();
      document.getElementById('newEntryText').value = '';
      
      // Success flash
      const btn = event.target;
      btn.textContent = "✅ Saved!";
      setTimeout(() => btn.textContent = "💾 Save to Vault", 2000);
    }

    // 💾 SAVE TO LOCALSTORAGE
    function saveVault() {
      try {
        localStorage.setItem('journalVault', JSON.stringify(allEntries));
      } catch (e) {
        console.error("Save failed:", e);
        alert("⚠️ Could not save — storage may be full.");
      }
    }

    // 📂 LOAD FROM STORAGE
    function loadVault() {
      try {
        const stored = localStorage.getItem('journalVault');
        allEntries = stored ? JSON.parse(stored) : [];
        
        // Seed with welcome entry if empty
        if (allEntries.length === 0) {
          allEntries = [{
            id: 'welcome',
            timestamp: new Date().toISOString(),
            text: "Welcome to your Journal Vault. This space is yours — unfiltered, unjudged, yours alone.\n\nWrite the things you can't say out loud. Celebrate the small wins no one else sees. Record the moments you felt stronger than the pain.\n\nYou are not just surviving. You are documenting a resurrection. 💙✨",
            source: 'Pleading Sanity'
          }];
          saveVault();
        }
        
        displayEntries(allEntries);
        updateStats();
      } catch (err) {
        document.getElementById('vault-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>Something went wrong loading your vault</h3>
            <p style="margin-top:10px;">${err.message}</p>
            <button class="btn" onclick="localStorage.removeItem('journalVault');loadVault()" style="margin-top:15px;">Reset Vault</button>
          </div>
        `;
      }
    }

    // 🎨 RENDER ENTRIES
    function displayEntries(entries) {
      const container = document.getElementById('vault-content');
      
      if (!entries.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <h3>No matching entries</h3>
            <p style="margin-top:10px;">Try different words or clear your search to see everything.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = entries.map((entry, index) => `
        <div class="entry" data-text="${entry.text.toLowerCase()}">
          <div class="entry-header">
            <span class="entry-number">#${index + 1}</span>
            <span class="entry-source">${entry.source || 'Journal'}</span>
            <span class="entry-date">${new Date(entry.timestamp).toLocaleString()}</span>
          </div>
          <div class="entry-text">${escapeHtml(entry.text)}</div>
        </div>
      `).join('');
    }

    // 🔒 Prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 📊 UPDATE STATS
    function updateStats() {
      const el = document.getElementById('stats');
      if (!allEntries.length) {
        el.innerHTML = '';
        return;
      }
      const dates = allEntries.map(e => new Date(e.timestamp));
      el.innerHTML = `
        📊 <strong>${allEntries.length}</strong> entries 
        | 📅 From ${new Date(Math.min(...dates)).toLocaleDateString()} 
        to ${new Date(Math.max(...dates)).toLocaleDateString()}
      `;
    }

    // 🔍 SEARCH
    function filterEntries() {
      const term = document.getElementById('searchBox').value.toLowerCase().trim();
      if (!term) {
        displayEntries(allEntries);
        return;
      }
      displayEntries(
        allEntries.filter(e => 
          e.text.toLowerCase().includes(term) || 
          (e.source && e.source.toLowerCase().includes(term))
        )
      );
    }

    // 📤 EXPORT
    function exportVault() {
      if (!allEntries.length) {
        alert("⚠️ Nothing to export yet.");
        return;
      }
      
      let content = "🧠 PLEADING SANITY — JOURNAL VAULT\n";
      content += `Exported: ${new Date().toLocaleString()}\n`;
      content += `Total Entries: ${allEntries.length}\n`;
      content += "=".repeat(60) + "\n\n";
      
      allEntries.forEach((e, i) => {
        content += `ENTRY ${i + 1}\n`;
        content += `Date: ${new Date(e.timestamp).toLocaleString()}\n`;
        content += `Source: ${e.source || 'Personal'}\n`;
        content += "-".repeat(40) + "\n";
        content += e.text + "\n";
        content += "=".repeat(60) + "\n\n";
      });
      
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `PleadingSanity_JournalVault_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 🖨️ PRINT
    function printVault() {
      if (!allEntries.length) {
        alert("⚠️ Nothing to print yet.");
        return;
      }
      
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Journal Vault — Pleading Sanity</title>
          <style>
            body { font-family: -apple-system, Arial, sans-serif; padding: 30px; line-height: 1.6; }
            h1 { color: #00fff0; text-align: center; }
            .entry { margin: 25px 0; padding: 20px; border-bottom: 1px solid #ddd; }
            .meta { color: #666; font-size: 0.9rem; margin-bottom: 10px; }
            .source { color: #ff00ff; font-weight: bold; }
          </style>
        </head>
        <body>
          <h1>📖 Journal Vault — Pleading Sanity</h1>
          <p style="text-align:center;">Exported: ${new Date().toLocaleString()}</p>
          <hr>
          ${allEntries.map((e, i) => `
            <div class="entry">
              <div class="meta">
                <strong>#${i+1}</strong> — 
                <span class="source">${e.source || 'Journal'}</span> — 
                ${new Date(e.timestamp).toLocaleString()}
              </div>
              <div style="white-space:pre-wrap;">${e.text}</div>
            </div>
          `).join('')}
        </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    // 🗑️ CLEAR
    function clearVault() {
      if (!confirm("⚠️ This will DELETE EVERYTHING. Cannot be undone. Sure?")) return;
      localStorage.removeItem('journalVault');
      allEntries = [];
      loadVault();
    }

    // ⌨️ KEYBOARD SHORTCUTS
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && document.activeElement.id === 'newEntryText') {
        e.preventDefault();
        addEntry();
      }
      if (e.key === 'Escape') {
        document.getElementById('searchBox').value = '';
        filterEntries();
        document.getElementById('newEntryText').blur();
      }
    });

    // 🚀 INIT
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadVault();
    });
  </script>
</body>
</html>
