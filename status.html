<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Status - Pleading Sanity</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 120%, #0d1b2a 0%, #000 80%);
      color: #f0f0f0;
      min-height: 100vh;
      padding: 20px;
      background-attachment: fixed;
    }

    .status-container {
      max-width: 900px;
      margin: 80px auto 40px;
      padding: 30px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 240, 0.2);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #00fff0 0%, #ff00ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 40px;
      font-size: 1.1em;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9em;
      text-transform: uppercase;
    }

    .status-badge.operational {
      background: rgba(0, 255, 160, 0.2);
      color: #00ffa0;
      border: 1px solid #00ffa0;
    }

    .status-badge.degraded {
      background: rgba(255, 165, 0, 0.2);
      color: #ffa500;
      border: 1px solid #ffa500;
    }

    .status-badge.fallback {
      background: rgba(255, 255, 0, 0.2);
      color: #ffff00;
      border: 1px solid #ffff00;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .service-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 255, 240, 0.2);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s;
    }

    .service-card:hover {
      border-color: #00fff0;
      box-shadow: 0 0 20px rgba(0, 255, 240, 0.2);
    }

    .service-name {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 10px;
      color: #00fff0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .service-detail {
      margin: 8px 0;
      font-size: 0.95em;
      color: #aaa;
    }

    .service-detail strong {
      color: #fff;
    }

    .meta-info {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 0, 255, 0.2);
    }

    .meta-info h3 {
      color: #ff00ff;
      margin-top: 0;
    }

    .color-swatch {
      display: inline-block;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      margin-right: 10px;
      vertical-align: middle;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #00fff0;
      font-size: 1.2em;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #ff5555;
      background: rgba(255, 85, 85, 0.1);
      border-radius: 12px;
      border: 1px solid #ff5555;
    }

    .refresh-btn {
      display: block;
      margin: 30px auto;
      padding: 12px 30px;
      background: linear-gradient(135deg, #00fff0 0%, #ff00ff 100%);
      border: none;
      border-radius: 25px;
      color: #0b0b1a;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 255, 240, 0.5);
    }

    .timestamp {
      text-align: center;
      color: #666;
      font-size: 0.9em;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      color: #888;
    }

    footer a {
      color: #00fff0;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="status-container">
    <h1>🌌 Cosmic Network Status</h1>
    <p class="subtitle">Real-time health monitoring for Pleading Sanity services</p>

    <div id="statusContent">
      <div class="loading">
        <p>🚀 Loading cosmic status...</p>
      </div>
    </div>

    <button class="refresh-btn" onclick="loadStatus()">🔄 Refresh Status</button>
  </div>

  <footer>
    <p>
      <a href="index.html">Home</a> | 
      <a href="public/chat.html">Arron AI</a> | 
      <a href="movement.html">Movement</a>
    </p>
    <p style="margin-top: 10px; color: #00fff0;">
      Rise From Madness — Pleading Sanity
    </p>
  </footer>

  <script>
    async function loadStatus() {
      const content = document.getElementById('statusContent');
      content.innerHTML = '<div class="loading"><p>🌌 Loading cosmic status...</p></div>';

      try {
        const response = await fetch('/.netlify/functions/health-check');
        const data = await response.json();

        let html = '';

        // Overall status
        html += `
          <div style="text-align: center; margin-bottom: 30px;">
            <span class="status-badge ${data.status}">${data.status.toUpperCase()}</span>
            <p style="margin-top: 15px; color: #aaa;">${data.message}</p>
          </div>
        `;

        // Services grid
        html += '<div class="service-grid">';
        
        for (const [serviceName, serviceData] of Object.entries(data.services)) {
          const displayName = serviceName.replace(/_/g, ' ').toUpperCase();
          
          html += `
            <div class="service-card">
              <div class="service-name">${displayName}</div>
              <div class="service-detail">
                <strong>Status:</strong> 
                <span class="status-badge ${serviceData.status}">${serviceData.status}</span>
              </div>
          `;

          if (serviceData.endpoint) {
            html += `<div class="service-detail"><strong>Endpoint:</strong> ${serviceData.endpoint}</div>`;
          }

          if (serviceData.configured !== undefined) {
            const configStatus = serviceData.configured === 'fallback_mode' 
              ? '🟡 Fallback Mode' 
              : serviceData.configured ? '✅ Configured' : '⚠️ Not Configured';
            html += `<div class="service-detail"><strong>Config:</strong> ${configStatus}</div>`;
          }

          if (serviceData.openai_configured !== undefined) {
            html += `<div class="service-detail"><strong>OpenAI:</strong> ${serviceData.openai_configured ? '✅' : '❌'}</div>`;
            html += `<div class="service-detail"><strong>YouTube:</strong> ${serviceData.youtube_configured ? '✅' : '❌'}</div>`;
            html += `<div class="service-detail"><strong>Shopify:</strong> ${serviceData.shopify_configured ? '✅' : '❌'}</div>`;
          }

          html += '</div>';
        }

        html += '</div>';

        // Branding info
        if (data.branding) {
          html += `
            <div class="meta-info">
              <h3>🎨 Cosmic Branding</h3>
              <div class="service-detail">
                <span class="color-swatch" style="background-color: ${data.branding.colors.primary}"></span>
                <strong>Primary:</strong> ${data.branding.colors.primary}
              </div>
              <div class="service-detail">
                <span class="color-swatch" style="background-color: ${data.branding.colors.secondary}"></span>
                <strong>Secondary:</strong> ${data.branding.colors.secondary}
              </div>
              <div class="service-detail">
                <span class="color-swatch" style="background-color: ${data.branding.colors.background}"></span>
                <strong>Background:</strong> ${data.branding.colors.background}
              </div>
              <div class="service-detail" style="margin-top: 15px;">
                <strong>Tagline:</strong> ${data.branding.tagline}
              </div>
            </div>
          `;
        }

        // Timestamp
        html += `
          <div class="timestamp">
            Last checked: ${new Date(data.timestamp).toLocaleString()}
            ${data.response_time_ms ? `• Response time: ${data.response_time_ms}ms` : ''}
          </div>
        `;

        content.innerHTML = html;

      } catch (error) {
        console.error('Error loading status:', error);
        content.innerHTML = `
          <div class="error">
            <h3>⚠️ Unable to load status</h3>
            <p>${error.message}</p>
            <p style="margin-top: 15px;">The cosmic network may be experiencing temporary issues.</p>
          </div>
        `;
      }
    }

    // Load status on page load
    window.addEventListener('DOMContentLoaded', loadStatus);

    // Auto-refresh every 60 seconds
    setInterval(loadStatus, 60000);
  </script>
</body>
</html>
