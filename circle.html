<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000103" />
  <title>Circle — Pleading Sanity</title>
  <meta name="description" content="A quiet check-in. Possy lifts a post. Neggy is private care, never a public pile-on." />
  <link rel="canonical" href="https://pleadingsanity.co.uk/circle.html" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/my-room.css" />
</head>
<body>
  <div class="wrap">
    <p class="note">Arron is a companion, not a therapist. The house sits with the story.</p>
    <div class="top">
      <a href="/"><img class="mark" src="/assets/images/brand/crying-brain-logo-512.webp" alt="Crying brain" /></a>
      <a class="btn" href="/feed.html">Feed</a>
    </div>
    <h1>Circle</h1>
    <p class="lede">Possy lifts someone in public. Neggy is a private hand, not a score to weaponise.</p>
    <section class="card" id="gate">
      <a class="btn solid" href="/login.html?next=/circle.html">Sign in</a>
    </section>
    <section class="card" id="here" hidden>
      <p class="price" id="count">0</p>
      <p class="note">Friends in your circle.</p>
      <p class="note" id="light">Your light: 0 possies given.</p>
      <label for="line">I'm here</label>
      <input id="line" maxlength="80" placeholder="Still here." />
      <button type="button" class="solid" id="check">Check in</button>
      <p class="note" id="status"></p>
      <div id="list"></div>
    </section>
  </div>
  <script type="module" src="/js/circle.js"></script>
</body>
</html>
